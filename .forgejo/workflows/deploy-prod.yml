name: Deploy to Production

on:
  push:
    branches: [prod]

jobs:
  deploy:
    name: Backup + Build + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подготовка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Бэкап базы данных
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash /opt/ovklife/backup.sh 2>/dev/null || echo 'Backup script not found, skipping'"

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wp-content/themes/ovklife/package-lock.json

      - name: Установка зависимостей темы
        run: |
          cd wp-content/themes/ovklife
          npm ci

      - name: Сборка темы (production)
        run: |
          cd wp-content/themes/ovklife
          npm run build

      - name: rsync темы на production
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'assets' \
            wp-content/themes/ovklife/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.PROD_PATH }}/wp-content/themes/ovklife/

      - name: Очистка кэша WordPress
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.PROD_PATH }} && wp cache flush --allow-root 2>/dev/null || true"

      - name: Health check
        run: |
          sleep 5
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://ovklife.ru || echo "000")
          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "301" ] || [ "$RESPONSE" = "302" ]; then
            echo "✅ Production deploy successful"
          else
            echo "⚠️ Warning: HTTP $RESPONSE (может потребоваться проверка)"
          fi
